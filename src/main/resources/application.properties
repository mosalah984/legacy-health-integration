spring.application.name=legacy-health-integration

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/legacy_health}
spring.datasource.username=${DB_USERNAME:health_app}
spring.datasource.password=${DB_PASSWORD:local_dev_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info